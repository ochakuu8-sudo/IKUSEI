<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画面仕上げの確認</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import DailyApp from '../../src/DailyApp.tsx';
import { freshDaily } from '../../src/daily.ts';
import { transition } from '../../src/adv/engine.ts';
import { SAVE_KEY } from '../../src/saveV14.ts';
import '../../src/styles.css';
const view = new URLSearchParams(location.search).get('view');
let state = freshDaily('presentation-review');
state.debugMode = view !== 'normal';
state.axes = { 貞操:88, 品位:45, 威厳:61 };
state.growthXP = { negotiation:1, knowledge:5, courage:0, charm:9 };
function apply(command) { const r = transition(state, command); if (r.error) throw new Error(r.error); state = r.state; }
function step(type, extra = {}) { const s = state.activeSession; apply({ type, sessionId:s.id, nodeId:s.nodeId, revision:s.revision, ...extra }); }
if (['choice','result','archive'].includes(view)) {
  apply({ type:'begin', jobId:view === 'choice' ? 'debug-challenge' : 'debug-training' });
  step('advance');
  if (view !== 'choice') { step('choose', {choiceId:'negotiation'}); step('advance'); }
  if (view === 'archive') step('acknowledge');
}
localStorage.setItem(SAVE_KEY, JSON.stringify(state));
localStorage.setItem('ikusei-prototype-ui-v14', JSON.stringify({tab:view === 'journal' ? 'journal' : 'today',sheet:null,speed:0,motion:false,volume:0,textSize:24,strongText:false}));
createRoot(document.getElementById('root')).render(React.createElement(DailyApp));
</script></body></html>
