<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850">
<defs><style>text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#443541}.label{font-size:19px}.small{font-size:16px;fill:#786a6c}.number{font-size:21px;fill:#fff8ed;font-weight:bold}.white{fill:#f7edde}.fine{stroke:#b69c7a;stroke-width:1;fill:none}</style><linearGradient id="room" x2="1" y2="1"><stop stop-color="#4c4550"/><stop offset="1" stop-color="#29232e"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e4bb7c"/></marker></defs>
