<path d="M1171 312Q1190 386 1160 433" stroke="#e4bb7c" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" fill="none"/>
</g>
<text x="120" y="661" class="small">1200 × 500 固定　／　顔 → 便り → 選択の流れ　／　文字面は水平、奥行きは外形と接地影で表現</text>
<g transform="translate(120 701)"><rect width="38" height="38" fill="#382b39"/><text x="51" y="25" class="label">葡萄色の革</text><rect x="260" width="38" height="38" fill="#efe2cc" stroke="#cbb798"/><text x="311" y="25" class="label">象牙色の紙</text><rect x="520" width="38" height="38" fill="#b79b6b"/><text x="571" y="25" class="label">控えめな古金</text><rect x="780" width="38" height="38" fill="#875567"/><text x="831" y="25" class="label">封蝋の深い赤紫</text></g>
<text x="120" y="795" class="label">次に作るもの：この配置を土台に、人物・背景・紙・金具を同じ描き込みで仕上げた完成見本。</text>
<text x="120" y="825" class="small">この図の平坦な色面・仮の人物形・文字サイズを、そのまま製品の外観として採用しない。</text>
