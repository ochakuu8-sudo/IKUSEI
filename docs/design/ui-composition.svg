<text x="18" y="97" font-size="24">伯爵家の</text><text x="18" y="129" font-size="24">臨時秘書</text>
<path d="M18 180H190" class="fine"/>
<text x="18" y="214" font-size="29">340 G</text><text x="18" y="241" class="small">貞操 −16　体力 −34</text>
</g>
<g transform="translate(722 150)"><rect x="4" y="7" width="210" height="258" fill="#1e1922" opacity=".4"/><rect width="210" height="258" fill="#ece0c9"/><circle cx="177" cy="26" r="13" fill="#7d5c47"/><text x="18" y="34" class="small">差出人の印と名前</text><text x="18" y="113" font-size="24">商会倉庫の荷造り</text><path d="M18 180H190" class="fine"/><text x="18" y="214" font-size="29">95 G</text><text x="18" y="241" class="small">品位 −10　体力 −38</text></g>
<g transform="translate(950 150)"><rect x="4" y="7" width="210" height="258" fill="#1e1922" opacity=".4"/><rect width="210" height="258" fill="#f3e8d4"/><circle cx="177" cy="26" r="13" fill="#78566c"/><text x="18" y="34" class="small">差出人の印と名前</text><text x="18" y="113" font-size="24">夜会への同伴</text><path d="M18 180H190" class="fine"/><text x="18" y="214" font-size="29">265 G</text><text x="18" y="241" class="small">威厳 −12　貞操 −8</text></g>
<rect x="28" y="372" width="424" height="100" fill="#3e2d3d" stroke="#a58b6a"/>
