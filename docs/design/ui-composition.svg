<text x="236" y="323" text-anchor="middle" class="small white">顔と衣装上半身に窓を重ねない</text>
<rect x="32" y="24" width="120" height="60" fill="#e2cfb1"/>
<text x="92" y="49" text-anchor="middle" class="small">第1章</text><text x="92" y="73" text-anchor="middle" class="label">1日目</text>
<text x="492" y="44" class="small white">② 返済と所持金 · 囲いを抑えた組版</text>
<text x="492" y="80" font-size="28" class="white">あと 930 G</text><text x="705" y="80" class="label white">手元 120 G</text>
<path d="M492 101H855" stroke="#b49b7a" opacity=".55"/>
<text x="940" y="48" class="label white">成長　回想　設定</text>
<text x="494" y="134" class="small white">③ 同じ重さで提示する3通の依頼</text>
<g transform="translate(494 150)">
<rect x="4" y="7" width="210" height="258" fill="#1e1922" opacity=".4"/>
<rect width="210" height="258" fill="#eee2cb"/>
<circle cx="177" cy="26" r="13" fill="#895264"/>
