flex;align-items:center;gap:8px}.growth .meter{height:4px;background:#72636b;flex:1;position:relative}.growth .meter:before,.growth .meter:after{content:"";position:absolute;top:-1px;bottom:-1px;width:2px;background:#302b34}.growth .meter:before{left:22.222%}.growth .meter:after{left:55.556%}.growth .xp{font:12px Georgia,serif;color:#d2c4b8;white-space:nowrap}.max .medallion{border-color:#d8b97e;background:#b9975020}.max .xp{color:#e4c07e;font-size:10px;letter-spacing:1px}

<header class="preview-head"><div><h1>記号で読むレイアウト</h1><p>素材生成前のラフ · 1200×500</p></div><nav class="switches" aria-label="プレビュー切替"><button data-view="desk" aria-pressed="true">依頼一覧</button><button data-view="adv" aria-pressed="false">ADV選択</button><button id="state" aria-pressed="false">変化後の例</button></nav></header>
<main class="frame"><div class="viewport"><div class="stage" id="stage">
<div class="backdrop"></div><img class="portrait" src="../art/ui/reform/hero.png" alt="既存の主人公の仮立ち絵"><div class="character-name"><small>LATIER</small>エレオノール</div>
<div class="calendar"><span data-icon="calendar"></span><div><small>第1章</small><strong>1<small>日目</small></strong></div></div><div class="stamina" data-help="体力 90 / 100"><span data-icon="energy"></span><div><small>体力</small><b>90</b><div class="bar"><i></i></div></div></div><div class="header-rule"></div>
<div class="finance"><div class="debt" data-help="今回の返済：120 / 1,050 G。残り930 G、期限まで14日。"><span data-icon="ledger"></span><div><div class="numbers"><small>返済残</small><strong>930</strong></div><div class="debt-track"><i></i></div></div><div class="deadline"><span data-icon="hourglass"></span><b>14</b><small>日</small></div></div><div class="wallet" data-help="所持金 120 G"><span data-icon="coin"></span><div><small>所持金</small><strong>120</strong></div></div></div><div class="menu"><span><i data-icon="ledger"></i>台帳</span><span><i data-icon="gallery"></i>回想</span><span><i data-icon="gear"></i>設定</span></div>
<div class="caption"><div id="caption">本日の便り</div><button id="rest"><i data-icon="moon"></i>休息</button></div>
<section class="offers" aria-label="3件の依頼" id="offers"></section>
<section class="adv" aria-label="ADVの選択プレビュー"><div class="speaker">クレール <span class="relation" id="speaker-bond"></span></div><h2>「今回は、どの役割を引き受けてくださる？」</h2><div class="choices"><div class="choice"><span class="choice-label"><i data-icon="arrow"></i>通常の仕事を終える</span><span class="condition"><i data-icon="check"></i></span></div><div class="choice"><span class="choice-label"><i data-icon="arrow"></i>代理の交渉役を引き受ける</span><span class="condition" id="negotiation-condition"></span></div><div class="choice locked" id="courage-choice"><span class="choice-label"><i data-icon="arrow"></i>難しい提案を皆の前で伝える</span><span class="condition" id="courage-condition"></span></div></div></section>
<div class="status-band"><section aria-label="尊厳3軸"><span class="band-title">尊厳</span><div class="dignity-items" id="dignity"></div></section><section aria-label="成長4項目"><span class="band-title">成長</span><div class="growth-items" id="growth"></div></section></div><div class="footer-hint">配置・表示のプレビュー</div>
</div></div></main>
<div class="note"><div class="help" id="help" aria-live="polite">名称は短く、段階は刻み、経験はゲージ。記号をタップすると意味を確認できます。</div><details><summary>記号の対応を見る</summary><div class="legend" id="legend"></div></details></div>
<script>
const shapes={
 rose:'<path d="M12 3c2-3 6 0 4 3 4-1 6 4 2 6 2 4-3 7-6 4-3 3-8 0-6-4-4-2-2-7 2-6-2-3 2-6 4-3Z"/><path d="m9 8 3-2 3 3-2 4-4-2Z M12 17v6m0-2c3 0 5-2 6-4-4 0-6 1-6 4"/>',
 dignity:'<ellipse cx="12" cy="12" rx="9" ry="11"/><circle cx="12" cy="8" r="3"/><path d="M6 18c0-7 12-7 12 0H6Z"/>',
 crown:'<path d="m3 7 4 4 5-7 5 7 4-4-2 11H5L3 7Zm2 14h14"/><circle cx="12" cy="3" r="1"/>',
 talk:'<path d="M3 4h18v12H10l-5 4v-4H3V4Zm4 4h10M7 12h6"/>',
 book:'<path d="M12 6C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 2Zm0 0v15M5 8l4 1m6 0 4-1M5 12l4 1m6 0 4-1"/>',
 shield:'<path d="m12 2 9 4v6c0 5-5 9-9 11-4-2-9-6-9-11V6l9-4Z"/><path d="m13 6-5 7h4l-1 5 5-8h-4l1-4Z"/>',
 charm:'<path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10ZM19 2v4m-2-2h4"/>',
 coin:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="7"/><path d="m12 7 4 5-4 5-4-5 4-5Z"/>',
 energy:'<path d="m14 2-9 12h6l-1 8 9-12h-6l1-8Z"/>',
 growth:'<path d="M12 22V10m0 6C6 17 3 13 3 9c5-1 9 2 9 7Zm0-5c0-6 4-9 9-8 0 5-3 9-9 8Z"/>',
 bond:'<path d="M12 6H8a5 5 0 0 0 0 10h4m0-10h4a5 5 0 0 1 0 10h-4M8 11h8"/>',
 arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
 check:'<path d="m5 12 4 4L20 5"/>',
 lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/>',
 calendar:'<rect x="3" y="5" width="18" height="17" rx="1"/><path d="M7 2v6m10-6v6M3 11h18m-14 4h3m4 0h3m-10 4h3"/>',
 hourglass:'<path d="M6 2h12M6 22h12M7 2v5l10 10v5M17 2v5L7 17v5M9 18h6"/>',
 ledger:'<path d="M5 2h15v20H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM7 2v20m4-15h5m-5 4h5m-5 4h3"/>',
 gallery:'<rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-5 4 3 4-7 4 5"/>',
 gear:'<path d="m9 3 1-2h4l1 2 3 2 3 1v4l-2 2 2 2v4l-3 1-3 2-1 2h-4l-1-2-3-2-3-1v-4l2-2-2-2V6l3-1 3-2Z"/><circle cx="12" cy="12" r="4"/>',
 moon:'<path d="M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12Z"/>'
};
const icon=k=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${shapes[k]||shapes.charm}</svg>`;
const marks=(n,max)=>`<span class="rank-marks" aria-hidden="true">${Array.from({length:max},(_,i)=>`<i class="${i<n?'lit':''}"></i>`).join('')}</span>`;
const bonds=n=>`<span data-help="人物との関係 ${n} / 3">${Array.from({length:3},(_,i)=>`<span class="${i<n?'':'dim'}">${icon('bond')}</span>`).join('')}</span>`;
const axes=[['貞操',88,'rose','#cba0b4'],['品位',45,'dignity','#c5b189'],['威厳',61,'crown','#a6b9d1']];
const growth=[['交渉',3,'talk'],['知見',5,'book'],['胆力',1,'shield'],['魅力',9,'charm']];
const offers=[{sender:'ヴェルネ',seal:'growth',bond:1,title:'工房の手伝い',pay:80,energy:10,effects:[['growth','+2','1項目選択','成長4項目から選んだ1項目の経験 +2']]},{sender:'クレール',seal:'book',bond:2,title:'商会の代理人',pay:80,energy:10,effects:[['growth','≥1','','成長1段階から専用の選択肢が開く']]},{sender:'ヴァレール伯爵',seal:'crown',bond:0,title:'夜会への同伴',pay:265,energy:24,effects:[['crown','−12','','威厳 −12'],['rose','−8','','貞操 −8']]}];
document.querySelector('#offers').innerHTML=offers.map(o=>`<article class="letter"><div class="sender"><span class="seal">${icon(o.seal)}</span><div>${o.sender}<div class="relation">${bonds(o.bond)}</div></div></div><h2>${o.title}</h2><div class="pay"><span class="reward" data-help="報酬 ${o.pay} G">${icon('coin')}<strong>${o.pay}</strong></span><span class="energy" data-help="体力 −${o.energy}">${icon('energy')}−${o.energy}</span></div><div class="effects">${o.effects.map(([key,v,label,help])=>`<span class="effect ${key==='growth'?'gain':''}" data-help="${help}">${icon(key)}${v}<small>${label}</small></span>`).join('')}</div><button aria-label="${o.title}のADV配置を見る" title="ADV配置を見る">${icon('arrow')}</button></article>`).join('');
document.querySelector('#speaker-bond').innerHTML=bonds(2);
document.querySelectorAll('[data-icon]').forEach(e=>e.outerHTML=icon(e.dataset.icon));
const stage=document.querySelector('#stage'),viewport=document.querySelector('.viewport');
function fit(){const s=viewport.clientWidth/1200;stage.style.transform=`scale(${s})`;viewport.style.height=`${500*s}px`;}new ResizeObserver(fit).observe(viewport);fit();
let progressed=false;
function helpTargets(){document.querySelectorAll('[data-help]').forEach(e=>{e.title=e.dataset.help;e.setAttribute('aria-label',e.dataset.help);e.tabIndex=0;e.classList.add('inspectable')})}
function draw(){
 document.querySelector('#dignity').innerHTML=axes.map(([name,base,key,ink],i)=>{const value=progressed?Math.max(0,base-[9,5,3][i]):base,rank=value<1?0:Math.ceil(value/20);return `<div class="axis" style="--ink:${ink}" data-help="${name}：ランク ${rank} / 5、数値 ${value}。失ったランクは回復しません。"><div class="name">${icon(key)}<span>${name}</span><b>${rank}</b></div>${marks(rank,5)}<div class="value"><span class="meter"><i style="width:${value}%"></i></span><span>${value}</span></div></div>`}).join('');
 document.querySelector('#growth').innerHTML=growth.map(([name,base,key])=>{const xp=progressed?Math.min(9,base+2):base,thresholds=[0,2,5,9],rank=thresholds.filter(n=>xp>=n).length-1,next=thresholds[rank+1],floor=thresholds[rank],fill=100*xp/thresholds.at(-1);return `<div class="growth ${next===undefined?'max':''}" data-help="${name}：${rank}段階、累積経験 ${xp}${next===undefined?'。最高段階。':` / ${next}、次まで ${next-xp}。ゲージは累積経験。刻みは段階の境界。`}"><div class="top"><span class="medallion">${icon(key)}</span><div class="identity"><div class="name">${name}<b>${rank}</b></div>${marks(rank,3)}</div></div><div class="progress"><span class="meter"><i style="width:${fill}%"></i></span><span class="xp">${xp}/9</span></div></div>`}).join('');
 [['negotiation-condition','talk','交渉',progressed?2:1],['courage-condition','shield','胆力',progressed?1:0]].forEach(([id,key,name,n])=>{const e=document.getElementById(id);e.innerHTML=`${icon(key)}${name}<b>≥1</b><span class="current">現在 ${n}</span><span class="result">${icon(n>=1?'check':'lock')}</span>`;e.setAttribute('aria-label',`${name}1以上が必要、現在${n}。${n>=1?'条件達成':'条件未達'}`)});
 document.querySelector('#courage-choice').classList.toggle('locked',!progressed);helpTargets();
}
function view(name){stage.classList.toggle('is-adv',name==='adv');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name));document.querySelector('#caption').textContent=name==='adv'?'あなたの返事':'本日の便り';document.querySelector('#rest').hidden=name==='adv';}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelector('#state').onclick=e=>{progressed=!progressed;e.currentTarget.setAttribute('aria-pressed',progressed);draw();document.querySelector('#help').textContent=progressed?'変化後の例：成長の点灯と、失われた尊厳の刻みを比較できます。':'名称は短く、段階は刻み、経験はゲージ。記号をタップすると意味を確認できます。'};document.querySelectorAll('.letter button').forEach(b=>b.onclick=()=>view('adv'));document.querySelector('#rest').onclick=()=>{document.querySelector('#help').textContent='休息の配置見本です。このプレビューでは日付・保存は変化しません。'};
function explain(e){const target=e.target.closest('[data-help]');if(target)document.querySelector('#help').textContent=target.dataset.help;}
document.addEventListener('click',explain);document.addEventListener('focusin',explain);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-help]')){e.preventDefault();explain(e)}});
document.querySelector('#legend').innerHTML=[['coin','金銭'],['energy','体力'],['growth','成長'],['bond','人物との関係'],...axes.map(([n,v,k])=>[k,n]),...growth.map(([n,v,k])=>[k,n])].map(([k,n])=>`<span>${icon(k)}${n}</span>`).join('');draw();
</script>
</html>
