const marks=(n,max)=>`<span class="rank-marks" aria-hidden="true">${Array.from({length:max},(_,i)=>`<i class="${i<n?'lit':''}"></i>`).join('')}</span>`;
const bonds=n=>`<span data-help="人物との関係 ${n} / 3">${Array.from({length:3},(_,i)=>`<span class="${i<n?'':'dim'}">${icon('bond')}</span>`).join('')}</span>`;
const axes=[['貞操',88,'rose','#cba0b4'],['品位',45,'dignity','#c5b189'],['威厳',61,'crown','#a6b9d1']];
const growth=[['交渉',3,'talk'],['知見',5,'book'],['胆力',1,'shield'],['魅力',9,'charm']];

const offers=[
 {sender:'ヴェルネ',seal:'growth',bond:1,title:'工房の手伝い',pay:80,energy:10,effects:[['growth','+2','1項目選択','成長4項目から選んだ1項目の経験 +2']],body:'新しい品の仕上げを、お手伝いいただけませんか。\n仕事の進め方は、工房で一緒に相談しましょう。',location:'工房 · 作業机',intro:'工房へ着くと、ヴェルネが作業台の前で手を振った。',question:'「材料も道具も揃った。さて、何から始めようか？」',labels:['道具を整えて作業を手伝う','材料の仕入れを交渉する','新しい作り方を提案する']},
 {sender:'クレール',seal:'book',bond:2,title:'商会の代理人',pay:80,energy:10,effects:[],body:'明日の取引に向け、書類整理をお願いしたく存じます。\n詳しい役割は、応接室でお話ししましょう。',location:'商会 · 応接室',intro:'商会の応接室で、クレールが契約書を差し出した。',question:'「今回は、どの役割を引き受けてくださる？」',labels:['書類の整理を引き受ける','代理の交渉役を引き受ける','難しい提案を皆の前で伝える']},
 {sender:'ヴァレール伯爵',seal:'crown',bond:0,title:'夜会への同伴',pay:265,energy:24,effects:[['crown','−12','','威厳 −12'],['rose','−8','','貞操 −8']],body:'今宵の夜会に、同伴をお願いしたい。\n支度が整ったら、広間へ来ていただけるだろうか。',location:'屋敷 · 広間',intro:'広間の入口で、伯爵が招待客の名簿を閉じた。',question:'「客人が来る前に、君の考えを聞いておこう。」',labels:['案内に従って席に着く','同伴する役目について話し合う','自分の希望をはっきり伝える']}
];
const effectMarkup=o=>o.effects.map(([key,v,label,help])=>`<span class="effect ${key==='growth'?'gain':''}" data-help="${help}">${icon(key)}${v}<small>${label}</small></span>`).join('');
const envelope=()=>'<svg class="envelope-svg" viewBox="0 0 252 153" aria-hidden="true"><path d="M1 2h250v148H1Z" fill="var(--paper)" stroke="#ab9474"/><path d="M1 2 126 86 1 150Z" fill="#a68e6d" opacity=".15"/><path d="m251 2-125 84 125 64Z" fill="#a68e6d" opacity=".12"/><path d="M1 150 98 66h56l97 84" fill="var(--paper)" stroke="#bca888" stroke-width=".7"/><path d="M2 4h248L134 88q-8 6-16 0Z" fill="#88704e" opacity=".2" transform="translate(0 3)"/><path d="M2 2h248L134 85q-8 6-16 0Z" fill="var(--paper)" stroke="#bca888" stroke-width=".8"/><path d="M5 148h242" stroke="#faf1df" opacity=".7"/></svg>';
document.querySelector('#offers').innerHTML=offers.map((o,i)=>`<article class="letter"><button class="open-envelope" data-offer="${i}" aria-label="${o.sender}からの手紙「${o.title}」を開く">${envelope()}<span class="envelope-address">エレオノール様</span><span class="wax">${icon(o.seal)}</span><span class="envelope-sender">${o.sender}</span></button><h2>${o.title}</h2><div class="letter-foot"><span class="reward" data-help="報酬 ${o.pay} G">${icon('coin')}<strong>${o.pay}</strong></span><span class="energy" data-help="体力 −${o.energy}">${icon('energy')}−${o.energy}</span><span class="relation">${bonds(o.bond)}</span></div><div class="effects">${effectMarkup(o)}</div></article>`).join('');
let selectedOffer=1,novelPhase='choice';
function showDetail(){const o=offers[selectedOffer];document.querySelector('#detail-title').textContent=o.title;document.querySelector('#detail-body').textContent=o.body;document.querySelector('#detail-sender').innerHTML=`${o.sender} <span class="relation">${bonds(o.bond)}</span>`;document.querySelector('#detail-terms').innerHTML=`<span class="reward" data-help="報酬 ${o.pay} G">${icon('coin')}<strong>${o.pay}</strong></span><span class="energy" data-help="体力 −${o.energy}" style="margin-top:12px">${icon('energy')}−${o.energy}</span><div class="effects" style="margin-top:12px">${effectMarkup(o)}</div>`;helpTargets();}
function renderNovel(){const o=offers[selectedOffer];document.querySelector('#scene-location').textContent=o.location;document.querySelector('#novel-speaker').textContent=novelPhase==='intro'?'地の文':novelPhase==='after'?'エレオノール':o.sender;document.querySelector('.novel').classList.toggle('is-choosing',novelPhase==='choice');document.querySelector('#novel-choices').hidden=novelPhase!=='choice';document.querySelector('#novel-next').innerHTML=(novelPhase==='after'?'封筒へ戻る':'次へ')+icon('arrow');if(novelPhase!=='after')document.querySelector('#novel-line').textContent=novelPhase==='intro'?o.intro:o.question;['normal-label','talk-label','courage-label'].forEach((id,i)=>document.getElementById(id).textContent=o.labels[i]);}
document.querySelectorAll('[data-icon]').forEach(e=>e.outerHTML=icon(e.dataset.icon));
const stage=document.querySelector('#stage'),viewport=document.querySelector('.viewport');
function fit(){const s=viewport.clientWidth/1200;stage.style.transform=`scale(${s})`;viewport.style.height=`${500*s}px`;}new ResizeObserver(fit).observe(viewport);fit();
let progressed=false;
function helpTargets(){document.querySelectorAll('[data-help]').forEach(e=>{e.title=e.dataset.help;e.setAttribute('aria-label',e.dataset.help);e.tabIndex=0;e.classList.add('inspectable')})}
function draw(){
 document.querySelector('#dignity').innerHTML=axes.map(([name,base,key,ink],i)=>{const value=progressed?Math.max(0,base-[9,5,3][i]):base,rank=value<1?0:Math.ceil(value/20);return `<div class="axis" style="--ink:${ink}" data-help="${name}：ランク ${rank} / 5、数値 ${value}。失ったランクは回復しません。"><div class="name">${icon(key)}<span>${name}</span><b>${rank}</b></div>${marks(rank,5)}<div class="value"><span class="meter"><i style="width:${value}%"></i></span><span>${value}</span></div></div>`}).join('');
 document.querySelector('#growth').innerHTML=growth.map(([name,base,key])=>{const xp=progressed?Math.min(9,base+2):base,thresholds=[0,2,5,9],rank=thresholds.filter(n=>xp>=n).length-1,next=thresholds[rank+1],floor=thresholds[rank],fill=100*xp/thresholds.at(-1);return `<div class="growth ${next===undefined?'max':''}" data-help="${name}：${rank}段階、累積経験 ${xp}${next===undefined?'。最高段階。':` / ${next}、次まで ${next-xp}。ゲージは累積経験。刻みは段階の境界。`}"><div class="top"><span class="medallion">${icon(key)}</span><div class="identity"><div class="name">${name}<b>${rank}</b></div>${marks(rank,3)}</div></div><div class="progress"><span class="meter"><i style="width:${fill}%"></i></span><span class="xp">${xp}/9</span></div></div>`}).join('');
 [['negotiation-condition','talk','交渉',progressed?2:1],['courage-condition','shield','胆力',progressed?1:0]].forEach(([id,key,name,n])=>{const e=document.getElementById(id);e.innerHTML=`${icon(key)}${name}<b>≥1</b><span class="current">現在 ${n}</span><span class="result">${icon(n>=1?'check':'lock')}</span>`;e.setAttribute('aria-label',`${name}1以上が必要、現在${n}。${n>=1?'条件達成':'条件未達'}`)});
 document.querySelector('#courage-choice').classList.toggle('locked',!progressed);document.querySelector('#courage-choice').setAttribute('aria-disabled',String(!progressed));helpTargets();
}

function view(name,phase='choice'){stage.dataset.scene=name;stage.classList.toggle('is-novel',name==='novel');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name));document.querySelector('#caption').textContent=name==='detail'?'差出人からの手紙':'本日の便り';document.querySelector('#rest').hidden=name!=='desk';if(name==='detail')showDetail();if(name==='novel'){novelPhase=phase;renderNovel();}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));
document.querySelector('#state').onclick=e=>{progressed=!progressed;e.currentTarget.setAttribute('aria-pressed',progressed);draw();document.querySelector('#help').textContent=progressed?'変化後の例：成長の点灯と、失われた尊厳の刻みを比較できます。':'記号をタップすると意味を確認できます。'};
document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{selectedOffer=Number(b.dataset.offer);view('detail')});
document.querySelector('#accept-letter').onclick=()=>view('novel','intro');document.querySelector('#close-letter').onclick=()=>view('desk');
document.querySelector('#novel-next').onclick=()=>{if(novelPhase==='after'){view('desk');return}novelPhase='choice';renderNovel()};
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-disabled')==='true'){document.querySelector('#help').textContent='この返答には胆力1以上が必要です。現在は0。「変化後の例」で達成状態を確認できます。';return}novelPhase='after';renderNovel();document.querySelector('#novel-line').textContent='「'+b.querySelector('.choice-label span').textContent+'。私に任せてください。」';document.querySelector('#help').textContent='選択後に会話へ戻る配置見本です。報酬・保存は変化しません。'});
document.querySelector('#rest').onclick=()=>{document.querySelector('#help').textContent='休息の配置見本です。このプレビューでは日付・保存は変化しません。'};
function explain(e){const target=e.target.closest('[data-help]');if(target)document.querySelector('#help').textContent=target.dataset.help;}
document.addEventListener('click',explain);document.addEventListener('focusin',explain);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-help]')){e.preventDefault();explain(e)}});
document.querySelector('#legend').innerHTML=[['coin','金銭'],['energy','体力'],['growth','成長'],['bond','人物との関係'],...axes.map(([n,v,k])=>[k,n]),...growth.map(([n,v,k])=>[k,n])].map(([k,n])=>`<span>${icon(k)}${n}</span>`).join('');draw();
</script>
</html>
