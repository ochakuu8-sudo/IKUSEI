<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>革装と墨刷りの書簡 — 改善プレビュー</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c191d;color:#e8decf;font-family:'Yu Gothic',Meiryo,sans-serif;padding:24px 24px 28px}main,header,footer{max-width:1440px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:20px}h1{font:23px 'Yu Mincho',serif;margin:0 0 8px;letter-spacing:.05em}header p,footer{font-size:12px;line-height:1.8;color:#b3a99d;margin-top:0}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:3px}nav+nav{border-left:1px solid #a28b6844;padding-left:16px}button{color:#bfb2a2;cursor:pointer;font:12px 'Yu Gothic',Meiryo,sans-serif;background:transparent;border:1px solid transparent;padding:9px 11px;white-space:nowrap}button[aria-pressed=true]{border-color:#ad916b7d;color:#ecdbbc;background:#a78b5f14}button:disabled{opacity:.3;cursor:default}button:focus-visible{outline:1px solid #dfc28e;outline-offset:3px}.stage{position:relative;aspect-ratio:12/5;box-shadow:0 12px 42px #0c090b4d;border:1px solid #93816344}iframe{width:100%;height:100%;display:block;border:0;position:absolute;inset:0}[hidden]{display:none!important}.caption{display:flex;justify-content:space-between;gap:30px;padding:18px 0 11px}.caption p{font:13px/1.9 'Yu Mincho',serif;margin:0;color:#c4b7a6}.caption strong{font-weight:400;color:#ead6b2}.caption .hint{font:11px/1.8 'Yu Gothic',sans-serif;text-align:right;color:#aa9e90}footer{border-top:1px solid #93816326;padding-top:13px;margin-top:8px;margin-bottom:0}@media(max-width:1240px){header{display:block}header p{margin-bottom:14px}.controls{gap:12px}}@media(max-width:760px){body{padding:16px 10px}h1{font-size:20px}.controls{gap:5px}nav+nav{padding-left:5px}button{padding:8px;font-size:11px}.caption{display:block}.caption .hint{text-align:left;margin-top:8px}}
</style></head><body><header><div><h1>革装と墨刷りの書簡</h1><p>C案の空気感と、D案の手紙を引き継いだ改善プレビュー。</p></div><div class="controls"><nav aria-label="変更前後"><button data-version="after" aria-pressed="true">改善案</button><button data-version="before" aria-pressed="false">基準の案</button></nav><nav aria-label="手紙の状態"><button data-scene="list" aria-pressed="true">一覧</button><button data-scene="detail" aria-pressed="false">開封後</button></nav><nav aria-label="表示する情報"><button data-example="normal" aria-pressed="true">通常</button><button data-example="varied" aria-pressed="false">情報の変化例</button></nav></div></header><main><div class="stage"><iframe id="after" title="改善案：Cの革装とDの書簡" src="refined-variant.html?theme=c&amp;letter=d"></iframe><iframe id="before" title="基準の案：視認性調整前のCとDの手紙" hidden></iframe></div><div class="caption"><p id="description"><strong>繊細さを残し、素材と振る舞いを整える。</strong><br>名前札を小さく。封筒は紙の重なりと墨色の封蝋を描き、金具には背革を添えました。</p><p class="hint">手紙を押すと開封。下の各パラメータを押すと説明。<br>「基準の案」は、視認性調整前のC案＋D案の手紙です。</p></div></main><footer>見た目を比較するためのプレビューです。署名や数値の変化例は実際のセーブ・ゲーム進行に影響しません。</footer><script>
const after=document.querySelector('#after'),before=document.querySelector('#before');let version='after',scene='list',example='normal';
function send(type,value){after.contentWindow.postMessage({type,value},location.origin)}
function sync(){document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.version===version));document.querySelectorAll('[data-scene]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.scene===scene);b.disabled=version==='before'});document.querySelectorAll('[data-example]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.example===example);b.disabled=version==='before'});before.hidden=version!=='before';after.hidden=version!=='after';if(version==='before'&&!before.getAttribute('src'))before.src='world-variant.html?theme=c&letter=d';document.querySelector('#description').innerHTML=version==='before'?'<strong>基準の案。</strong><br>視認性調整前のC案に、D案の封筒を組み合わせた画面。':example==='varied'?'<strong>情報が変わっても、静かな見た目を保つ。</strong><br>長い依頼名・固定の成長報酬・尊厳低下・体力不足の表示例です。':scene==='detail'?'<strong>開いた後も、同じ一通の手紙に。</strong><br>封筒と同じ紙色・墨の二重罫・薔薇の印を、便箋と署名まで引き継いでいます。':'<strong>繊細さを残し、素材と振る舞いを整える。</strong><br>名前札を小さく。封筒は紙の重なりと墨色の封蝋を描き、金具には背革を添えました。'}
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;sync()});
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;send('refinement-detail',scene==='detail');sync()});
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{example=b.dataset.example;scene='list';send('refinement-example',example);sync()});
addEventListener('message',e=>{if(e.origin===location.origin&&e.source===after.contentWindow&&e.data?.type==='refinement-scene'){scene=e.data.value;sync()}});sync();
</script></body></html>
